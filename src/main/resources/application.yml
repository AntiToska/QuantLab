spring:
  application:
    name: quantlab

quantlab:
  market-data:
    persistence:
      enabled: false
      jdbc-url: jdbc:postgresql://localhost:5432/quantlab
      username: quantlab
      password: quantlab
    exchanges:
      - binance
      - okx
    default-symbol: BTCUSDT
    capture-run:
      enabled: false
      exchange: BINANCE
      symbol: BTCUSDT
      interval: ONE_MINUTE
      duration-seconds: 30
    binance:
      enabled: true
      ws-url: wss://stream.binance.com:443/ws
      real-client-enabled: false
      proxy-enabled: false
      proxy-host:
      proxy-port:
      reconnect-delay-millis: 3000
      heartbeat-interval-seconds: 15
      symbols:
        - BTCUSDT
        - ETHUSDT
    okx:
      enabled: false
      ws-url: wss://ws.okx.com:8443/ws/v5/public
      real-client-enabled: false
      proxy-enabled: false
      proxy-host:
      proxy-port:
      reconnect-delay-millis: 3000
      heartbeat-interval-seconds: 15
      symbols:
        - BTCUSDT
    bybit:
      enabled: false
      ws-url: wss://stream.bybit.com/v5/public/spot
      real-client-enabled: false
      proxy-enabled: false
      proxy-host:
      proxy-port:
      reconnect-delay-millis: 3000
      heartbeat-interval-seconds: 15
      symbols:
        - BTCUSDT
  research:
    backtest-run:
      enabled: false
      exchange: BINANCE
      symbol: BTCUSDT
      interval: ONE_MINUTE
      from-inclusive: 2026-06-17T00:00:00Z
      to-exclusive: 2026-06-17T01:00:00Z
      strategy: close-price-momentum
      latest-bars:
      output-directory: ./output/research
      initial-cash: "10000"
      trade-quantity: "1"
    seed-data:
      enabled: false
      exchange: BINANCE
      symbol: BTCUSDT
      interval: ONE_MINUTE
      from-inclusive: 2026-06-17T00:00:00Z
      bars: 120
      start-price: "100"
      price-step: "1"
      volume: "10"
