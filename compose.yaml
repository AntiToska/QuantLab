services:
  postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    environment:
      POSTGRES_DB: quantlab
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab
    ports:
      - "5432:5432"
    volumes:
      - quantlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quantlab-postgres-data:
